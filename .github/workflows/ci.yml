name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}})

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18.4"
            otp: "27.3.4.13"

          - elixir: "1.19.5"
            otp: "28.5.0.2"

          - elixir: "1.20.1"
            otp: "28.5.0.2"

          - elixir: "1.20.1"
            otp: "29.0.2"
            lint: true

          # Test on latest Elixir to catch problems early
          - elixir: "main-otp-29"
            otp: "maint-29"
            lint: true

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}

      - name: Restore deps and _build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}

      - name: Install deps
        run: mix deps.get --check-locked

      - name: Remove compiled application files
        run: mix clean

      - name: Compile
        run: mix compile
        if: ${{ !matrix.lint }}
        env:
          MIX_ENV: test

      - name: Compile & lint
        run: mix compile --warnings-as-errors
        if: ${{ matrix.lint }}
        env:
          MIX_ENV: test

      - name: Compile without optional deps
        run: mix compile --no-optional-deps --warnings-as-errors
        if: ${{ matrix.lint }}
        env:
          MIX_ENV: dev

      - name: Run test suite
        run: mix test --warnings-as-errors

  check:
    name: Code Quality (OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}})

    strategy:
      matrix:
        include:
          - elixir: "1.20.1"
            otp: "29.0.2"

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}

      - name: Restore deps and _build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}

      - name: Install deps
        run: mix deps.get --check-locked

      - name: Run code quality checks
        run: mix check

      - name: Build Docs
        run: mix docs --warnings-as-errors
        env:
          MIX_ENV: dev

  dialyzer:
    name: dialyzer (OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}})

    env:
      MIX_ENV: test

    # Run Dialyzer on the pinned toolchain (mise.toml)
    strategy:
      matrix:
        include:
          - elixir: "1.20.1"
            otp: "28.5.0.2"

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}

      - name: Restore deps and _build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}

      - name: Restore plt cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: plts-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            plts-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}

      - name: Install deps
        run: mix deps.get --check-locked

      - name: Build PLTs
        run: mix dialyzer --plt

      - name: Run Dialyzer
        run: mix dialyzer --format github
